# JackBOT OS - hard disk GRUB template for multi-boot (2..5 systems)
#
# GOLDEN RULE (sectors must not be shared):
#   Every operating system is installed on its OWN partition and therefore
#   owns its own sectors. The JackBOT installer formats ONLY the JackBOT
#   target partition and never writes to the other partitions, so the other
#   systems are never overwritten.
#
# Example GPT layout - adjust the gptN numbers to your real partition table:
#   hd0,gpt1  EFI System Partition (ESP)
#   hd0,gpt2  JackBOT OS
#   hd0,gpt3  System 2
#   hd0,gpt4  System 3
#   hd0,gpt5  System 4
#   hd0,gpt6  System 5
#
# FIRMWARE DIFFERENCE:
#   BIOS/legacy : chainload the partition boot sector -> set root=(hd0,gptN)
#                 then `chainloader +1`
#   UEFI        : every OS keeps its own folder on the shared ESP, e.g.
#                 chainloader /EFI/Microsoft/Boot/bootmgfw.efi
#                 JackBOT uses /EFI/JackBOT/ and never deletes other /EFI dirs.

insmod all_video
insmod gfxterm
insmod part_gpt
insmod chain
insmod fat

set gfxpayload=keep
terminal_input console
terminal_output gfxterm

set timeout=10
set default=0

set color_normal=white/black
set menu_color_normal=white/black
set menu_color_highlight=black/white

menuentry "JackBOT OS" {
    insmod multiboot2
    multiboot2 /boot/kernel
    boot
}

# --- BIOS/legacy style entries (UEFI replacements noted in comments) ---
# UEFI System 2 example: chainloader /EFI/System2/bootx64.efi
menuentry "System 2" {
    insmod chain
    set root=(hd0,gpt3)
    chainloader +1
}
# UEFI System 3 example: chainloader /EFI/System3/bootx64.efi
menuentry "System 3" {
    insmod chain
    set root=(hd0,gpt4)
    chainloader +1
}
# UEFI System 4 example: chainloader /EFI/System4/bootx64.efi
menuentry "System 4" {
    insmod chain
    set root=(hd0,gpt5)
    chainloader +1
}
# UEFI System 5 example: chainloader /EFI/System5/bootx64.efi
menuentry "System 5" {
    insmod chain
    set root=(hd0,gpt6)
    chainloader +1
}
