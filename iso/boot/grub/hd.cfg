set timeout=0
set default=0

insmod multiboot2

# The installed system carries all 205 language TTFs as one LGFONT bundle
# next to the kernel; declaring it as a multiboot module is what makes the
# kernel index them (<CODE>.TTF lookups resolve out of the bundle).
menuentry "JackBOT OS" {
    multiboot2 /boot/kernel
    module2 /boot/LGFONT.BIN LGFONT
    boot
}

menuentry "Reboot" {
    reboot
}
