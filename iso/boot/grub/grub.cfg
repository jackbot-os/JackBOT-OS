set timeout=0
set default=0

insmod font
loadfont /boot/grub/fonts/unicode.pf2
insmod all_video
insmod gfxterm
insmod vbe
terminal_output gfxterm
set gfxmode=auto

menuentry "Install JackBOT OS" {
    set gfxpayload=1920x1080x32,1280x720x32,1024x768x32,auto
    multiboot2 /boot/kernel jb.live=1
    module2 /boot/grub/i386-pc/boot.img BOOTIMG
    module2 /boot/grub/i386-pc/core.img COREIMG
    module2 /boot/GRUBMODS.BIN GRUBMODS
    module2 /boot/grub/hd.cfg GRUBCFG
    module2 /boot/grub/fonts/unicode.pf2 FONT
    module2 /boot/kernel SYSKERNEL
    module2 /boot/fonts/SANS.TTF FSANS
    module2 /boot/fonts/MONO.TTF FMONO
    module2 /boot/fonts/MONOB.TTF FMONOB
    module2 /boot/fonts/CJK.TTF FCJK
    module2 /boot/fonts/KR.TTF FKR
    module2 /boot/fonts/AR.TTF FAR
    module2 /boot/fonts/TH.TTF FTH
    module2 /boot/fonts/HI.TTF FHI
    module2 /boot/BOOT.PCM BOOTPCM
    module2 /boot/WARN.PCM WARNPCM
    boot
}

menuentry "Reboot" {
    reboot
}
